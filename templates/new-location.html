{% extends "inventory.html" %}
{% block content %}

    <div class="new-location-form-container default-form-container">
        <div class="new-location-form-header">
            <h1 class="assets-heading" >Add New Location</h1>
        </div>
        <form class="new-location-form default-form" action="{{ url_for('save_location') }}" method="POST" id="location-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="location-tag">Location Name</label>
                <input type="text" id="location-tag" name="location-tag" placeholder="Enter Location Name" required maxlength="200" value="{{ form_values.get('location-tag', '') }}">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" autocomplete="tel" maxlength="32" name="phone" placeholder="Enter Phone Number" value="{{ form_values.get('phone', '') }}">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter Full Address" value="{{ form_values.get('address', '') }}">
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="Enter City Name"  value="{{ form_values.get('city', '') }}">
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state"  name="state" placeholder="Enter State Name" value="{{ form_values.get('state', '') }}">
            </div>

            <div class="form-group">
                <label for="post-code">Post Code</label>
                <input type="text" id="post-code"  name="post-code" placeholder="Enter the PostCode" value="{{ form_values.get('post-code', '') }}">
            </div>

            <div class="form-actions">
                <a href="{{ url_for('locations') }}" class="form-cancel">Cancel</a>
                <button type="submit" class="btn save-btn"><i class="fa-solid fa-check" aria-hidden="true"></i> Save</button>
            </div>
        </form>
    </div>


<script>
    // Optional: You can add JavaScript validation if needed
    document.getElementById('location-form').addEventListener('submit', function(event) {
        // Example: prevent form submission if required fields are missing or invalid
        const form = event.target;
        const fields = form.querySelectorAll('[required]');
        let valid = true;

        fields.forEach(function(field) {
            if (!field.value) {
                valid = false;
                field.classList.add('error');
            } else {
                field.classList.remove('error');
            }
        });

        if (!valid) {
            event.preventDefault();
            alert("Please fill out all required fields.");
        }
    });
</script>

{% endblock %}
