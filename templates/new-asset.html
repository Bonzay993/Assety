{% extends "inventory.html" %}
{% block content %}

    
    <div class="new-asset-form-container default-form-container">
        <div class="new-asset-form-header">
            <h1 class="assets-heading">Add New Asset</h1>
        </div>
        <form class="new-asset-form default-form" action="{{ url_for('save_asset') }}" method="POST" enctype="multipart/form-data" id="asset-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="asset-tag">Asset Tag</label>
                <input type="text" id="asset-tag" name="asset-tag" placeholder="Enter Asset Tag" required maxlength="200" value="{{ form_values.get('asset-tag', '') }}">
            </div>

            <div class="form-group form-group-category">
                <label for="category">Category</label>
    
                <select id="category" name="category" required>
                    <option value="">Select a Category</option>
                    {% for category in categories %}
                        <option value="{{ category.name }}" {% if form_values.get('category') == category.name %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>

                <div class="create-new-element-btn">
                    <button type="button" class="new-element-btn" onclick="openPopup('category')">New</button>
                </div>
              
            </div>
            <div class="tooltip-text">
                <p>If Empty, Categories need to be created by clicking on the button</p>
            </div>
            

            <div class="form-group">
                <label for="serial">Serial Number</label>
                <input type="text" id="serial" name="serial" placeholder="Enter Serial Number" value="{{ form_values.get('serial', '') }}">
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" name="model" placeholder="Enter Model" value="{{ form_values.get('model', '') }}">
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" maxlength="4000" placeholder="Enter any notes here" rows="4">{{ form_values.get('notes', '') }}</textarea>
            </div>

            <div class="form-group">
                <label for="warranty">Warranty Expiry</label>
                <div class="date-wrapper" onclick="document.getElementById('warranty').showPicker?.()">
                    <input type="date" id="warranty" name="warranty" value="{{ form_values.get('warranty', '') }}">
                </div>
            </div>

            <div class="form-group">
                <label for="order-number">Order Number</label>
                <input type="text" id="order-number" name="order-number" placeholder="Enter Order Number"  value="{{ form_values.get('order-number', '') }}">
            </div>

            <div class="form-group">
                <label for="purchase-cost">Purchase Cost</label>
                 <input type="text" id="purchase-cost" name="purchase-cost" placeholder="{{ currency_symbol }}" value="{{ form_values.get('purchase-cost', '') }}">
            </div>

            <div class="form-group">
                <label for="purchase-date">Purchase Date</label>
                <div class="date-wrapper" onclick="document.getElementById('purchase-date').showPicker?.()">
                    <input type="date" id="purchase-date" name="purchase-date" value="{{ form_values.get('purchase-date', '') }}">
                </div>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <select id="location" name="location">
                    <option value="">Select a location</option>
                    {% for location in locations %}
                        <option value="{{ location.location_tag }}" {% if form_values.get('location') == location.location_tag %}selected{% endif %}>{{ location.location_tag }}</option>
                    {% endfor %}
                </select>

                <div class="create-new-element-btn">
                    <button type="button" class="new-element-btn" onclick="openPopup('location')">New</button>
                </div>
            </div>
            <div class="tooltip-text">
                <p>If Empty, Locations need to be created by clicking on the button
            </div>
            <div class="form-group">
                <label for="asset-image">Upload Asset Image</label>
                <input type="file" id="asset-image" name="image" accept="image/*">
            </div>

            <div class="form-actions">
                <a href="{{ url_for('assets') }}" class="form-cancel">Cancel</a>
                <button type="submit" class="btn save-btn"><i class="fa-solid fa-check" aria-hidden="true"></i> Save</button>
            </div>
        </form>
    </div>

        <!-- Category Modal -->
    <div id="popup-modal-category" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Create category" style="display: none;">
        <div class="modal-content modal-new-category">
            <iframe id="popup-frame-category" title="New category form" src="about:blank"></iframe>
            <button onclick="closePopup('category')" class="modal-close-btn">Close</button>
        </div>
    </div>

    <!-- Location Modal -->
    <div id="popup-modal-location" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Create location" style="display: none;">
        <div class="modal-content modal-new-location">
            <iframe id="popup-frame-location" title="New location form" src="about:blank"></iframe>
            <button onclick="closePopup('location')" class="modal-close-btn">Close</button>
        </div>
    </div>

<script>
    window.addEventListener('message', event => {
        if (event.origin !== window.location.origin || !event.data || event.data.type !== 'assety-option-saved') return;
        const { kind, name } = event.data;
        if (!['category', 'location'].includes(kind) || typeof name !== 'string') return;
        const frame = document.getElementById('popup-frame-' + kind);
        if (!frame || event.source !== frame.contentWindow) return;
        const select = document.getElementById(kind);
        let option = Array.from(select.options).find(item => item.value === name);
        if (!option) {
            option = new Option(name, name);
            select.add(option);
        }
        select.value = name;
        closePopup(kind);
    });
   
    document.getElementById('asset-form').addEventListener('submit', function(event) {
        
        const form = event.target;
        const fields = form.querySelectorAll('[required]');
        let valid = true;

        fields.forEach(function(field) {
            if (!field.value) {
                valid = false;
                field.classList.add('error');
            } else {
                field.classList.remove('error');
            }
        });

        if (!valid) {
            event.preventDefault();
            alert("Please fill out all required fields.");
        }
    });


    let popupReturnFocus;
    function openPopup(type) {
        let modal, iframe, url;

        if (type === "category") {
            modal = document.getElementById("popup-modal-category");
            iframe = document.getElementById("popup-frame-category");
            url = "{{ url_for('new_category') }}?modal=true";
        } else if (type === "location") {
            modal = document.getElementById("popup-modal-location");
            iframe = document.getElementById("popup-frame-location");
            url = "{{ url_for('new_location') }}?modal=true";
        }

        if (modal && iframe && url) {
            popupReturnFocus = document.activeElement;
            document.getElementById('asset-form').inert = true;
            document.getElementById('sidebar').inert = true;
            document.querySelector('.app-header').inert = true;
            iframe.onload = () => {
                if (modal.style.display !== 'flex') return;
                iframe.contentDocument?.addEventListener('keydown', event => {
                    if (event.key === 'Escape') closePopup(type);
                });
            };
            iframe.src = url;
            modal.style.display = "flex";
            modal.querySelector('.modal-close-btn').focus();
        }
    }

    document.addEventListener('keydown', event => {
        const modal = Array.from(document.querySelectorAll('.modal-overlay')).find(item => item.style.display === 'flex');
        if (!modal) return;
        const kind = modal.id.endsWith('category') ? 'category' : 'location';
        if (event.key === 'Escape') closePopup(kind);
        if (event.key === 'Tab' && document.activeElement === modal.querySelector('.modal-close-btn') && !event.shiftKey) {
            event.preventDefault();
            modal.querySelector('iframe').focus();
        }
    });
    function closePopup(type) {
        let modal, iframe;

        if (type === "category") {
            modal = document.getElementById("popup-modal-category");
            iframe = document.getElementById("popup-frame-category");
        } else if (type === "location") {
            modal = document.getElementById("popup-modal-location");
            iframe = document.getElementById("popup-frame-location");
        }

        if (modal && iframe) {
            iframe.src = "about:blank";
            modal.style.display = "none";
            document.getElementById('asset-form').inert = false;
            document.getElementById('sidebar').inert = false;
            document.querySelector('.app-header').inert = false;
            if (popupReturnFocus?.isConnected) popupReturnFocus.focus();
        }
    }

</script>



{% endblock %}
