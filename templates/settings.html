{% extends "inventory.html" %}

{% block content %}
<div class="settings-container">
    <h1>{{ trans('settings') }}</h1>

   
 <form id="settings-form">
       <div class="settings-row">
            <label for="dark-mode-toggle">{{ trans('dark_mode') }}</label>
            <div class="settings-field">
                <input id="dark-mode-toggle" type="checkbox" {% if settings.dark_mode %}checked{% endif %}>
                <label for="dark-mode-toggle">Yes</label>
            </div>
        </div>


        <div class="settings-row">
            <label for="idle-timeout-input">{{ trans('auto_logout_time') }}</label>
            <div class="settings-field">
                <input id="idle-timeout-input" type="number" min="1" max="120" value="{{ settings.timeout or 20 }}">
            </div>
        </div>


        <div class="settings-row">
            <label for="email-notifications-toggle">{{ trans('email_notifications') }}</label>
            <div class="settings-field">
                <input id="email-notifications-toggle" type="checkbox" {% if settings.email_notifications %}checked{% endif %}>
                <label for="email-notifications-toggle">Enabled</label>
            </div>
        </div>

        <div class="settings-row">
            <label for="language-select">{{ trans('language') }}</label>
            <div class="settings-field">
                <select id="language-select">
                    <option value="en" {% if settings.language == 'en' %}selected{% endif %}>English</option>
                    <option value="es" {% if settings.language == 'es' %}selected{% endif %}>Spanish</option>
                    <option value="fr" {% if settings.language == 'fr' %}selected{% endif %}>French</option>
                </select>
            </div>
        </div>

        <div class="settings-row">
            <label for="currency-select">{{ trans('currency') }}</label>
            <div class="settings-field">
                <select id="currency-select">
                    <option value="GBP" {% if settings.currency == 'GBP' %}selected{% endif %}>£ Pound</option>
                    <option value="EUR" {% if settings.currency == 'EUR' %}selected{% endif %}>€ Euro</option>
                    <option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>$ Dollar</option>
                </select>
            </div>
        </div>

        <div class="settings-actions">
            <button type="submit" class="settings-btn save-settings-btn">{{ trans('save') }}</button>
        </div>
    </form>

    <section id="change-email" class="email-settings" aria-labelledby="change-email-heading">
        <h2 id="change-email-heading">{{ trans('change_email') }}</h2>
        <p>{{ trans('change_email_help') }}</p>
        <form id="change-email-form">
            <div class="settings-row">
                <span>{{ trans('current_email') }}</span>
                <span id="current-email" class="settings-field">{{ email }}</span>
            </div>
            <div class="settings-row">
                <label for="new-email">{{ trans('new_email') }}</label>
                <div class="settings-field">
                    <input id="new-email" name="email" type="email" autocomplete="email" maxlength="254" required>
                </div>
            </div>
            <div class="settings-row">
                <label for="email-current-password">{{ trans('current_password') }}</label>
                <div class="settings-field">
                    <input id="email-current-password" name="password" type="password" autocomplete="current-password" required>
                </div>
            </div>
            <p id="change-email-message" class="email-settings-message" role="status" aria-live="polite" aria-atomic="true"></p>
            <div class="settings-actions">
                <button type="submit" class="settings-btn" id="change-email-button">{{ trans('change_email') }}</button>
            </div>
        </form>
    </section>
</div>


<script>
    document.getElementById('settings-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const timeout = document.getElementById('idle-timeout-input').value;
        const darkMode = document.getElementById('dark-mode-toggle').checked;
        const emailNotifications = document.getElementById('email-notifications-toggle').checked;
        const language = document.getElementById('language-select').value;
        const currency = document.getElementById('currency-select').value;

        fetch('/save-settings', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content
            },
         
            body: JSON.stringify({ timeout: parseInt(timeout), dark_mode: darkMode, email_notifications: emailNotifications, language: language, currency: currency })
        })
        .then(response => {
            if (response.ok) {
                if (darkMode) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
                document.documentElement.setAttribute('lang', language);
                alert('Settings saved.');
                window.location.reload();
            } else {
                alert('Failed to save settings.');
            }
        });
    

      
    });
</script>
<script>
document.getElementById('change-email-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const button = document.getElementById('change-email-button');
    const message = document.getElementById('change-email-message');
    const password = document.getElementById('email-current-password');
    const email = document.getElementById('new-email');
    button.disabled = true;
    button.textContent = {{ trans('saving') | tojson }};
    message.textContent = '';
    try {
        const response = await fetch({{ url_for('change_email') | tojson }}, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content},
            body: JSON.stringify({email: email.value, password: password.value})
        });
        const result = await response.json();
        if (response.status === 401) {
            message.textContent = {{ trans('sign_in_again') | tojson }};
        } else if (!response.ok) {
            message.textContent = result.message || {{ trans('something_wrong') | tojson }};
        } else {
            document.getElementById('current-email').textContent = result.email;
            email.value = '';
            message.textContent = {{ trans('email_updated') | tojson }};
        }
    } catch (error) {
        message.textContent = {{ trans('something_wrong') | tojson }};
    } finally {
        password.value = '';
        button.disabled = false;
        button.textContent = {{ trans('change_email') | tojson }};
    }
});
</script>
{% endblock %}
