{% extends "index.html" %}
{% block content %}
<section class="login">
    <div class="login-container error-page">
        <h1>{{ code }} — {{ 'Page not found' if code == 404 else 'Unable to complete the request' }}</h1>
        <p role="alert">{{ message }}</p>
        <p><a class="cta-btn" href="{{ url_for('dashboard') if session.get('user_id') else url_for('index') }}">{{ 'Back to dashboard' if session.get('user_id') else 'Back to home' }}</a></p>
    </div>
</section>
{% endblock %}
