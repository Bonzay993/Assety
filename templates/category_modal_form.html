<!-- templates/category_modal_form.html -->

{% extends "base_modal.html" %}
{% block content %}
<div class="new-location-form-container default-form-container">
    <form class="new-location-form default-form" action="{{ url_for('save_category') }}?modal=true" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="category-name">Name</label>
            <input type="text" id="category-name" name="category-name" placeholder="Enter Category Name" required maxlength="200" value="{{ form_values.get('category-name', '') }}">
        </div>
    
        <div class="form-group">
            <label for="category-type">Type</label>
            <input type="text" id="category-type" name="category-type" placeholder="Enter Type" value="{{ form_values.get('category-type', '') }}">
        </div>
    
        <div class="form-group">
            <label for="asset-image">Upload Category Image</label>
            <input type="file" id="asset-image" name="image" accept="image/*">
        </div>
    
        <div class="form-actions">
            <button type="submit" class="btn save-btn"><i class="fa-solid fa-check" aria-hidden="true"></i> Save</button>
        </div>
    </form>
</div>
{% endblock %}
